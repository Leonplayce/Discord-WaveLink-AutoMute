name: Code scanning - PSScriptAnalyzer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module ConvertToSARIF -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .github/psscriptanalyzer.psd1)
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $results | ConvertTo-SARIF -FilePath results.sarif

      - name: Upload SARIF to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer
